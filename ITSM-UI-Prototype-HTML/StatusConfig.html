<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Status Configuration</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700;800&display=swap">
<style>
html, body { margin: 0; padding: 0; }
body { display: flex; justify-content: center; background: #E4E7EC; padding: 20px 0; box-sizing: border-box; font-family: 'Public Sans', sans-serif; }

  body { margin: 0; font-family: 'Public Sans', sans-serif; background: #F7F8FA; }
  a { color: #175CD3; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .tree-grp { font-size: 10.5px; font-weight: 800; color: #8A94A6; text-transform: uppercase; letter-spacing: 0.6px; padding: 14px 14px 6px 14px; margin-top: 4px; display: flex; align-items: center; gap: 6px; border-top: 1px solid #EDEFF2; }
  .tree-grp:first-child { border-top: none; margin-top: 0; padding-top: 10px; }
  .tree-item { display: flex; align-items: center; gap: 8px; padding: 7px 14px 7px 30px; font-size: 12.5px; color: #344054; border-left: 3px solid transparent; box-sizing: border-box; }
  .tree-item:hover { background: #F5F8FE; }
  .tree-item.active { background: #E3EBFB; color: #175CD3; font-weight: 700; border-left-color: #175CD3; }
  .tree-subgrp { font-size: 11px; font-weight: 700; color: #475467; padding: 12px 14px 4px 44px; }
  .tree-subitem { padding-left: 44px; }

  .field { border: 1px solid #D0D5DD; border-radius: 5px; background: #FFFFFF; padding: 0 11px; height: 36px; font-size: 13px; font-family: 'Public Sans', sans-serif; color: #1D2433; width: 100%; box-sizing: border-box; appearance: none; }
  .field:focus { outline: none; border-color: #175CD3; box-shadow: 0 0 0 3px rgba(23,92,211,0.14); }
  .field:disabled { background: #F7F8FA; color: #98A2B3; cursor: not-allowed; }
  textarea.field { height: auto; min-height: 64px; padding: 8px 11px; resize: vertical; line-height: 1.5; }
  .lbl { font-size: 12px; font-weight: 600; color: #344054; display: block; margin-bottom: 5px; }
  .req { color: #D92D20; }
  .hint { font-size: 11px; color: #98A2B3; margin-top: 4px; }
  .fld { display: flex; flex-direction: column; }

  .eyebrow { display: flex; align-items: center; justify-content: space-between; padding-bottom: 11px; border-bottom: 2px solid #1D2433; margin-bottom: 18px; flex: none; }
  .eyebrow-title { font-size: 11.5px; font-weight: 800; color: #1D2433; text-transform: uppercase; letter-spacing: 0.6px; display: flex; align-items: center; gap: 8px; }

  .btn-ghost { height: 34px; padding: 0 16px; border: 1px solid #D0D5DD; border-radius: 7px; background: #FFFFFF; font-size: 12.5px; color: #344054; font-weight: 600; cursor: pointer; }
  .btn-primary { height: 34px; padding: 0 16px; border: none; border-radius: 7px; background: #175CD3; color: #FFFFFF; font-size: 12.5px; font-weight: 700; cursor: pointer; box-shadow: 0 1px 2px rgba(23,92,211,0.35); }

  .status-row { display: flex; align-items: center; gap: 12px; padding: 9px 10px; border-radius: 7px; }
  .status-row:hover { background: #F5F8FE; }
  .status-row.selected { background: #E3EBFB; }
  .status-order { width: 26px; height: 26px; border-radius: 50%; background: #EFF4FC; color: #175CD3; font-size: 11px; font-weight: 700; display: flex; align-items: center; justify-content: center; flex: none; }
  .status-name { font-size: 13px; font-weight: 700; color: #1D2433; cursor: pointer; display: flex; align-items: center; gap: 7px; }
  .status-name:hover { color: #175CD3; text-decoration: underline; }
  .status-sub { font-size: 11.5px; color: #98A2B3; margin-top: 1px; }
  .status-version-badge { font-size: 9.5px; font-weight: 700; color: #175CD3; background: #EFF4FC; padding: 1px 7px; border-radius: 10px; flex: none; cursor: default; text-decoration: none !important; }
  .status-badge { font-size: 10px; font-weight: 700; padding: 2px 9px; border-radius: 10px; flex: none; }
  .status-badge.active { color: #067647; background: #ECFDF3; border: 1px solid #ABEFC6; }
  .status-badge.inactive { color: #98A2B3; background: #F2F4F7; }
  .edit-btn { width: 28px; height: 28px; border: none; background: transparent; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #98A2B3; flex: none; }
  .edit-btn:hover { background: #E4E7EC; color: #175CD3; }
  .check-row { display: flex; align-items: center; gap: 8px; font-size: 12.5px; color: #344054; font-weight: 600; }
  .check-row input { width: 14px; height: 14px; accent-color: #175CD3; cursor: pointer; }

  .list-header-row { display: flex; align-items: center; gap: 12px; padding: 6px 10px 8px 10px; border-bottom: 1px solid #EDEFF2; margin-bottom: 2px; font-size: 10.5px; font-weight: 800; color: #8A94A6; text-transform: uppercase; letter-spacing: 0.5px; }

  .history-item { display: flex; flex-direction: column; gap: 2px; padding: 10px 12px; border: 1px solid #E4E7EC; border-radius: 7px; background: #F9FAFB; }
  .history-item + .history-item { margin-top: 8px; }
  .history-top { display: flex; align-items: center; gap: 7px; }
  .history-version-badge { font-size: 9.5px; font-weight: 800; color: #175CD3; background: #EFF4FC; padding: 1px 7px; border-radius: 10px; flex: none; }
  .history-label { font-size: 12.5px; color: #1D2433; font-weight: 600; }
  .history-meta { font-size: 11px; color: #98A2B3; }

  .app-nav { width: 260px; flex: none; background: #FFFFFF; border-right: 1px solid #D5DAE1; overflow: hidden; box-sizing: border-box; position: relative; transition: width 0.15s ease; display: flex; flex-direction: column; }
  .app-nav.collapsed { width: 60px; }
  .nav-toggle { position: absolute; top: 14px; right: -12px; width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; border: 1px solid #D5DAE1; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 5; box-shadow: 0 1px 2px rgba(16,24,40,0.1); }
  .nav-rail-item { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px auto; cursor: pointer; color: #667085; }
  .nav-rail-item.active { background: #E3EBFB; color: #175CD3; }
  .nav-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  .nav-scroll::-webkit-scrollbar { width: 6px; }
  .nav-scroll::-webkit-scrollbar-track { background: transparent; }
  .nav-scroll::-webkit-scrollbar-thumb { background: #D0D5DD; border-radius: 6px; }
  .nav-scroll::-webkit-scrollbar-thumb:hover { background: #98A2B3; }

  .panel-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  .panel-scroll::-webkit-scrollbar { width: 6px; }
  .panel-scroll::-webkit-scrollbar-track { background: transparent; }
  .panel-scroll::-webkit-scrollbar-thumb { background: #D0D5DD; border-radius: 6px; }
  .panel-scroll::-webkit-scrollbar-thumb:hover { background: #98A2B3; }

</style>
</head>
<body>
<div id="app-root"></div>
<template id="app-template">
<div style="width: 1360px; height: 820px; box-sizing: border-box; background: #F7F8FA; display: flex; flex-direction: column; position: relative;">

  <!-- top header -->
  <div style="height: 46px; flex: none; background: #14213D; display: flex; align-items: center; justify-content: space-between; padding: 0 14px; box-sizing: border-box;">
    <div style="display: flex; align-items: center; gap: 14px;">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M4 6h16M4 12h16M4 18h16" stroke="#B7C0D4" stroke-width="1.8" stroke-linecap="round"></path></svg>
      <div style="display: flex; align-items: center; gap: 7px;">
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><rect x="3" y="3" width="8" height="8" rx="1.5" fill="#5B9BF0"></rect><rect x="13" y="3" width="8" height="8" rx="1.5" fill="#175CD3"></rect><rect x="3" y="13" width="8" height="8" rx="1.5" fill="#175CD3"></rect><rect x="13" y="13" width="8" height="8" rx="1.5" fill="#5B9BF0"></rect></svg>
        <div style="font-size: 13px; font-weight: 700; color: #FFFFFF;">Meridian</div>
      </div>
    </div>
    <div style="display: flex; align-items: center; gap: 16px;">
      <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M18 8a6 6 0 10-12 0c0 7-3 9-3 9h18s-3-2-3-9z" stroke="#B7C0D4" stroke-width="1.6" stroke-linejoin="round"></path><path d="M13.7 21a2 2 0 01-3.4 0" stroke="#B7C0D4" stroke-width="1.6" stroke-linecap="round"></path></svg>
      <div style="width: 24px; height: 24px; border-radius: 4px; background: #175CD3; color: #FFFFFF; font-weight: 700; font-size: 10.5px; display: flex; align-items: center; justify-content: center;">AD</div>
    </div>
  </div>

  <div style="flex-grow: 1; display: flex; min-height: 0;">

    <!-- APP NAVIGATOR -->
    <div class="{{navClass}}">

      <button class="nav-toggle" onClick="{{toggleNav}}" title="{{navToggleTitle}}">
        <svg width="10" height="10" viewBox="0 0 24 24" fill="none" style="transform: {{chevronTransform}};"><path d="M15 6l-6 6 6 6" stroke="#667085" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
      </button>

      <sc-if value="{{navExpanded}}" hint-placeholder-val="{{true}}">
        <div style="padding: 10px 12px; border-bottom: 1px solid #EDEFF2; flex: none;">
          <input type="text" placeholder="Filter navigator" style="width: 100%; height: 28px; padding: 0 8px; border: 1px solid #D0D5DD; border-radius: 5px; font-size: 12px; color: #344054; box-sizing: border-box;">
        </div>
        <div class="nav-scroll">
          <div style="padding: 4px 0;">

            <div class="tree-grp">User</div>
            <a href="MyIncidents.html" class="tree-item" style="text-decoration:none;">My Incidents</a>
            <a href="CreateIncident.html" class="tree-item" style="text-decoration:none;">New Incident</a>
            <div class="tree-item">Feedback Moderation</div>
            <div class="tree-item">Approve Incident Records</div>

            <div class="tree-grp">Manage Incidents</div>
            <a href="Main.html" class="tree-item" style="text-decoration:none;">Incident List</a>
            <a href="CreateIncident.html" class="tree-item" style="text-decoration:none;">New Incident for User</a>
            <div class="tree-item">Work Order List</div>

            <div class="tree-grp">Configuration</div>

            <div class="tree-subgrp">Incident Masters</div>
            <a href="CategoryConfig.html" class="tree-item tree-subitem" style="text-decoration:none;">Category</a>
            <a href="ClassificationConfig.html" class="tree-item tree-subitem" style="text-decoration:none;">Classification</a>
            <div class="tree-item tree-subitem">Incident Work Order Checklist</div>
            <div class="tree-item tree-subitem">Checklist</div>
            <div class="tree-item tree-subitem">Closure Code</div>
            <div class="tree-item tree-subitem">Log Incident Page</div>
            <div class="tree-item tree-subitem">End User Incident Details Page</div>
            <div class="tree-item tree-subitem">Pending Reason</div>
            <div class="tree-item tree-subitem">Resolution Code</div>

            <div class="tree-subgrp">SLA Configurations</div>
            <div class="tree-item tree-subitem">Impact</div>
            <div class="tree-item tree-subitem">SLA Matrix By CI</div>
            <div class="tree-item tree-subitem">Priority</div>
            <div class="tree-item tree-subitem">Priority Matrix</div>
            <div class="tree-item tree-subitem">Workgroup SLA Window</div>
            <div class="tree-item tree-subitem">SLA Service Window</div>
            <div class="tree-item tree-subitem">SLA Matrix</div>
            <div class="tree-item tree-subitem">Urgency</div>

            <div class="tree-subgrp">TFS</div>
            <div class="tree-item tree-subitem">TFS Configuration</div>
            <div class="tree-item tree-subitem">Work Item Field Configuration</div>
            <div class="tree-item tree-subitem">Value to Value Mapping</div>
            <div class="tree-item tree-subitem">Profile Mapping</div>
            <div class="tree-item tree-subitem">TFS Profile Mapping</div>

            <div class="tree-subgrp">Others</div>
            <div class="tree-item tree-subitem">Cost Configuration</div>
            <div class="tree-item tree-subitem">Feedback Configuration</div>
            <div class="tree-item tree-subitem">ETR E-mail Notification</div>
            <div class="tree-item tree-subitem active">Status Configuration</div>
            <a href="StatusTransitionMatrix.html" class="tree-item tree-subitem" style="text-decoration:none;">Status Transition Matrix</a>
            <div class="tree-item tree-subitem">E-mail Notification</div>
            <div class="tree-item tree-subitem">SMS Notification</div>
            <div class="tree-item tree-subitem">Voice Call Notification</div>
            <div class="tree-item tree-subitem">Information Ticker</div>
            <div class="tree-item tree-subitem">Major Incident</div>
            <div class="tree-item tree-subitem">Rule</div>
            <div class="tree-item tree-subitem">User Type</div>
            <div class="tree-item tree-subitem">Auto Work Order Configuration</div>
            <div class="tree-item tree-subitem">Standard Operating Procedure (SOP)</div>
            <div class="tree-item tree-subitem">Evaluator Configuration</div>
            <div class="tree-item tree-subitem">Approver Group Configuration</div>
            <div class="tree-item tree-subitem">Approval Configuration</div>

            <div class="tree-subgrp">User Management</div>
            <a href="UsersList.html" class="tree-item tree-subitem" style="text-decoration:none;">Users</a>
            <a href="CreateUser.html" class="tree-item tree-subitem" style="text-decoration:none;">Create New User</a>

          </div>
        </div>
      </sc-if>

      <sc-if value="{{navCollapsed}}" hint-placeholder-val="{{false}}">
        <div class="nav-scroll" style="padding-top: 56px; display: flex; flex-direction: column; align-items: center;">
          <div class="nav-rail-item" title="User">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><circle cx="12" cy="8" r="3.4" stroke="currentColor" stroke-width="1.6"></circle><path d="M5 20c1.2-4 4-6 7-6s5.8 2 7 6" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg>
          </div>
          <div class="nav-rail-item" title="Manage Incidents">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M9 4h6a1 1 0 011 1v1H8V5a1 1 0 011-1z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path><rect x="5" y="6" width="14" height="15" rx="2" stroke="currentColor" stroke-width="1.6"></rect><path d="M8.5 12h7M8.5 16h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"></path></svg>
          </div>
          <div class="nav-rail-item active" title="Configuration">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none"><path d="M12 15a3 3 0 100-6 3 3 0 000 6z" stroke="currentColor" stroke-width="1.5"></path><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09a1.65 1.65 0 00-1-1.51 1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06a1.65 1.65 0 00.33-1.82 1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09a1.65 1.65 0 001.51-1 1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06a1.65 1.65 0 001.82.33H9a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06a1.65 1.65 0 00-.33 1.82V9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z" stroke="currentColor" stroke-width="1.3"></path></svg>
          </div>
        </div>
      </sc-if>

    </div>

    <!-- MAIN -->
    <div style="flex-grow: 1; overflow: hidden; box-sizing: border-box; display: flex; flex-direction: column; min-width: 0;">

      <!-- page header -->
      <div style="padding: 16px 28px; border-bottom: 1px solid #E4E7EC; background: #FFFFFF; flex: none;">
        <div style="font-size: 11.5px; color: #98A2B3; margin-bottom: 6px;"><span>Configuration</span> <span style="color:#D0D5DD;">&gt;</span> <span>Others</span> <span style="color:#D0D5DD;">&gt;</span> <span style="color:#344054; font-weight: 500;">Status Configuration</span></div>
        <div style="display: flex; align-items: flex-start; justify-content: space-between;">
          <div>
            <div style="font-weight: 800; font-size: 20px; color: #0F1626; letter-spacing: -0.2px;">Status Configuration</div>
            <div style="font-size: 12.5px; color: #667085; margin-top: 3px;">Define the incident statuses available across the application. Every rename is versioned and tracks who made the change.</div>
          </div>
          <a href="Main.html" class="btn-ghost" style="text-decoration:none; display:flex; align-items:center;">Close</a>
        </div>
      </div>

      <div style="flex-grow: 1; overflow: hidden; padding: 22px 28px 24px 28px; box-sizing: border-box; display: flex; flex-direction: column; min-height: 0;">

        <sc-if value="{{listOpen}}" hint-placeholder-val="{{true}}">
          <div class="eyebrow" style="margin-bottom: 12px;">
            <div class="eyebrow-title">
              <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke="#1D2433" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
              Statuses ({{statusCount}})
            </div>
            <button type="button" class="btn-primary" onClick="{{openAdd}}" style="height: 30px; padding: 0 14px; display: flex; align-items: center; gap: 6px;">
              <svg width="12" height="12" viewBox="0 0 24 24" fill="none"><path d="M12 5v14M5 12h14" stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"></path></svg>
              Add Status
            </button>
          </div>

          <!-- SEARCH -->
          <div style="position: relative; margin-bottom: 12px; max-width: 360px; flex: none;">
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" style="position: absolute; left: 10px; top: 50%; transform: translateY(-50%); pointer-events: none;"><circle cx="11" cy="11" r="7" stroke="#98A2B3" stroke-width="1.8"></circle><path d="M21 21l-4.3-4.3" stroke="#98A2B3" stroke-width="1.8" stroke-linecap="round"></path></svg>
            <input class="field" style="padding-left: 30px;" type="text" placeholder="Search statuses by name or description…" value="{{searchQuery}}" onChange="{{setSearchQuery}}">
          </div>

          <div class="panel-scroll" style="border: 1px solid #E4E7EC; border-radius: 8px; background: #FFFFFF; padding: 8px;">

            <div class="list-header-row">
              <div style="width: 26px; flex: none;"></div>
              <div style="flex: 1 1 auto; min-width: 0;">Status Name</div>
              <div style="width: 70px; flex: none;">Status</div>
              <div style="width: 28px; flex: none;"></div>
            </div>

            <sc-for list="{{rows}}" as="row" hint-placeholder-count="8">
              <div class="{{row.rowClass}}">
                <div class="status-order">{{row.displayOrder}}</div>
                <div style="flex: 1 1 auto; min-width: 0;">
                  <div class="status-name" onClick="{{row.onEdit}}">
                    {{row.name}}
                    <span class="status-version-badge" title="{{row.versionTitle}}">v{{row.version}}</span>
                  </div>
                  <div class="status-sub">{{row.description}}</div>
                </div>
                <span class="{{row.statusBadgeClass}}" style="width: 70px; flex: none; text-align: center;">{{row.statusLabel}}</span>
                <button type="button" class="edit-btn" title="Edit status" onClick="{{row.onEdit}}">
                  <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4L16.5 3.5z" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"></path></svg>
                </button>
              </div>
            </sc-for>

            <sc-if value="{{noResults}}" hint-placeholder-val="{{false}}">
              <div style="padding: 32px 12px; text-align: center; color: #98A2B3; font-size: 12.5px;">No statuses match “{{searchQuery}}”.</div>
            </sc-if>

          </div>
        </sc-if>

        <!-- INLINE EDIT / ADD STATUS VIEW: opens within the same page -->
        <sc-if value="{{formOpen}}" hint-placeholder-val="{{false}}">
          <div class="eyebrow" style="margin-bottom: 12px;">
            <div class="eyebrow-title">
              <button type="button" onClick="{{cancelForm}}" style="width: 26px; height: 26px; border: none; background: transparent; border-radius: 6px; cursor: pointer; display: flex; align-items: center; justify-content: center; color: #1D2433; margin-right: 2px;">
                <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M15 6l-6 6 6 6" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"></path></svg>
              </button>
              {{formHeading}}
            </div>
            <button type="button" class="btn-ghost" onClick="{{cancelForm}}">Back to Statuses</button>
          </div>

          <div class="panel-scroll" style="border: 1px solid #E4E7EC; border-radius: 8px; background: #FFFFFF; padding: 22px 26px; flex: 1 1 auto; min-height: 0;">
            <div style="display: flex; gap: 36px; align-items: flex-start;">

              <!-- LEFT COLUMN: status fields -->
              <div style="flex: 1 1 50%; min-width: 0; display: flex; flex-direction: column; gap: 18px;">
                <div class="eyebrow">
                  <div class="eyebrow-title">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M4 12l5 5L20 6" stroke="#1D2433" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"></path></svg>
                    Status Information
                  </div>
                </div>

                <div class="fld"><label class="lbl">Status Name <span class="req">*</span></label><input class="field" type="text" placeholder="e.g. In Progress" value="{{formName}}" onChange="{{setFormName}}"></div>

                <div class="fld"><label class="lbl">Description</label><textarea class="field" onChange="{{setFormDescription}}" placeholder="When and how this status should be used…">{{formDescription}}</textarea></div>

                <div style="display: grid; grid-template-columns: repeat(2, minmax(0,1fr)); column-gap: 20px;">
                  <div class="fld"><label class="lbl">Display Order</label><input class="field" type="number" min="1" value="{{formDisplayOrder}}" onChange="{{setFormDisplayOrder}}"></div>
                  <div class="fld">
                    <label class="lbl">Status</label>
                    <div style="display: flex; align-items: center; height: 36px;">
                      <label class="check-row"><input type="checkbox" checked="{{formIsActive}}" onChange="{{toggleFormActive}}">Active</label>
                    </div>
                  </div>
                </div>

                <sc-if value="{{formRenamePreview}}" hint-placeholder-val="{{false}}">
                  <div class="hint" style="background: #FFFAEB; border: 1px solid #FEDF89; color: #B54708; padding: 8px 10px; border-radius: 6px;">
                    Saving will rename “{{formOriginalName}}” → “{{formName}}” and add a new version to the history, recorded under your name.
                  </div>
                </sc-if>
              </div>

              <!-- RIGHT COLUMN: version history -->
              <div style="flex: 1 1 50%; min-width: 0; display: flex; flex-direction: column; gap: 12px; border-left: 1px solid #E4E7EC; padding-left: 32px;">
                <div class="eyebrow">
                  <div class="eyebrow-title">
                    <svg width="13" height="13" viewBox="0 0 24 24" fill="none"><path d="M12 8v4l3 3" stroke="#1D2433" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"></path><circle cx="12" cy="12" r="9" stroke="#1D2433" stroke-width="1.6"></circle></svg>
                    Version History
                  </div>
                </div>

                <sc-if value="{{hasHistory}}" hint-placeholder-val="{{false}}">
                  <div>
                    <sc-for list="{{formHistoryRows}}" as="h" hint-placeholder-count="2">
                      <div class="history-item">
                        <div class="history-top">
                          <span class="history-version-badge">v{{h.version}}</span>
                          <span class="history-label">{{h.label}}</span>
                        </div>
                        <div class="history-meta">Modified by {{h.modifiedBy}} on {{h.modifiedOn}}</div>
                      </div>
                    </sc-for>
                  </div>
                </sc-if>

                <sc-if value="{{isNewStatus}}" hint-placeholder-val="{{true}}">
                  <div class="hint">This status doesn’t exist yet — saving will record version 1 as “Created”, tagged with your name and the current date/time.</div>
                </sc-if>
              </div>

            </div>
          </div>

          <div style="display: flex; align-items: center; gap: 10px; padding: 14px 2px 0 2px; flex: none;">
            <button type="button" class="btn-primary" onClick="{{saveForm}}">Save Changes</button>
            <button type="button" class="btn-ghost" onClick="{{cancelForm}}">Cancel</button>
          </div>
        </sc-if>

      </div>
    </div>
  </div>

</div>
</template>
<script src="dc-mini-runtime.js"></script>
<script>

const CURRENT_USER = 'Admin User';

function formatNow() {
  const d = new Date();
  const months = ['Jan', 'Feb', 'Mar', 'Apr', 'May', 'Jun', 'Jul', 'Aug', 'Sep', 'Oct', 'Nov', 'Dec'];
  let hours = d.getHours();
  const ampm = hours >= 12 ? 'PM' : 'AM';
  hours = hours % 12;
  if (hours === 0) hours = 12;
  const mins = String(d.getMinutes()).padStart(2, '0');
  return d.getDate() + ' ' + months[d.getMonth()] + ' ' + d.getFullYear() + ', ' + hours + ':' + mins + ' ' + ampm;
}

function mkStatus(id, name, overrides) {
  const base = {
    id: id,
    name: name,
    description: '',
    displayOrder: 1,
    active: true,
    history: [
      { version: 1, previousName: null, newName: name, modifiedBy: 'System', modifiedOn: '02 Jan 2025, 09:00 AM', action: 'Created' }
    ]
  };
  return Object.assign(base, overrides || {});
}

function resetFormFields() {
  return {
    formOriginalName: null,
    formName: '',
    formDescription: '',
    formDisplayOrder: 1,
    formActive: true
  };
}

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = Object.assign({
      navCollapsed: false,
      searchQuery: '',
      formEditId: null,
      statuses: [
        mkStatus('st1', 'New', { description: 'Incident has just been logged and not yet triaged.', displayOrder: 1 }),
        mkStatus('st2', 'Assigned', {
          description: 'Incident has been assigned to a workgroup or agent.',
          displayOrder: 2,
          history: [
            { version: 1, previousName: null, newName: 'Acknowledged', modifiedBy: 'System', modifiedOn: '02 Jan 2025, 09:00 AM', action: 'Created' },
            { version: 2, previousName: 'Acknowledged', newName: 'Assigned', modifiedBy: 'Rahul Mehta', modifiedOn: '20 Mar 2025, 11:05 AM', action: 'Renamed' }
          ]
        }),
        mkStatus('st3', 'In Progress', {
          description: 'Agent is actively working on the incident.',
          displayOrder: 3,
          history: [
            { version: 1, previousName: null, newName: 'Work In Progress', modifiedBy: 'System', modifiedOn: '02 Jan 2025, 09:00 AM', action: 'Created' },
            { version: 2, previousName: 'Work In Progress', newName: 'In Progress', modifiedBy: 'Priya Nair', modifiedOn: '14 Jun 2025, 03:22 PM', action: 'Renamed' }
          ]
        }),
        mkStatus('st4', 'On Hold', { description: 'Work is paused pending a dependency.', displayOrder: 4 }),
        mkStatus('st5', 'Pending Customer', { description: 'Waiting on information or confirmation from the requester.', displayOrder: 5 }),
        mkStatus('st6', 'Resolved', { description: 'A fix has been applied; awaiting closure confirmation.', displayOrder: 6 }),
        mkStatus('st7', 'Closed', { description: 'Incident is fully closed.', displayOrder: 7 }),
        mkStatus('st8', 'Cancelled', { description: 'Incident was raised in error or is no longer required.', displayOrder: 8, active: false })
      ]
    }, resetFormFields());
  }

  toggleNav() {
    this.setState({ navCollapsed: !this.state.navCollapsed });
  }

  setSearchQuery(e) { this.setState({ searchQuery: e.target.value }); }

  openEdit(id) {
    const status = this.state.statuses.find((s) => s.id === id);
    if (!status) return;
    this.setState({
      formEditId: id,
      formOriginalName: status.name,
      formName: status.name,
      formDescription: status.description,
      formDisplayOrder: status.displayOrder,
      formActive: status.active !== false
    });
  }

  openAdd() {
    this.setState({
      formEditId: 'new',
      formOriginalName: null,
      formName: '',
      formDescription: '',
      formDisplayOrder: this.state.statuses.length + 1,
      formActive: true
    });
  }

  setFormName(e) { this.setState({ formName: e.target.value }); }
  setFormDescription(e) { this.setState({ formDescription: e.target.value }); }
  setFormDisplayOrder(e) { this.setState({ formDisplayOrder: e.target.value }); }
  toggleFormActive(e) { this.setState({ formActive: e.target.checked }); }

  cancelForm() {
    this.setState(Object.assign({ formEditId: null }, resetFormFields()));
  }

  saveForm() {
    const name = this.state.formName.trim();
    if (!name) return;
    const displayOrder = Number(this.state.formDisplayOrder) || 1;
    const description = this.state.formDescription.trim();

    if (this.state.formEditId === 'new') {
      const newStatus = {
        id: 'st' + Date.now(),
        name: name,
        description: description,
        displayOrder: displayOrder,
        active: this.state.formActive,
        history: [
          { version: 1, previousName: null, newName: name, modifiedBy: CURRENT_USER, modifiedOn: formatNow(), action: 'Created' }
        ]
      };
      this.setState(Object.assign({ statuses: this.state.statuses.concat([newStatus]), formEditId: null }, resetFormFields()));
      return;
    }

    const editId = this.state.formEditId;
    const originalName = this.state.formOriginalName;
    const statuses = this.state.statuses.map((s) => {
      if (s.id !== editId) return s;
      let history = s.history;
      if (name !== originalName) {
        history = history.concat([
          { version: history.length + 1, previousName: originalName, newName: name, modifiedBy: CURRENT_USER, modifiedOn: formatNow(), action: 'Renamed' }
        ]);
      }
      return Object.assign({}, s, {
        name: name,
        description: description,
        displayOrder: displayOrder,
        active: this.state.formActive,
        history: history
      });
    });
    this.setState(Object.assign({ statuses: statuses, formEditId: null }, resetFormFields()));
  }

  renderVals() {
    const query = this.state.searchQuery.trim().toLowerCase();
    const filtered = !query ? this.state.statuses : this.state.statuses.filter((s) => (s.name + ' ' + s.description).toLowerCase().indexOf(query) !== -1);
    const sorted = filtered.slice().sort((a, b) => a.displayOrder - b.displayOrder);

    const rows = sorted.map((s) => {
      const last = s.history[s.history.length - 1];
      return {
        key: s.id,
        name: s.name,
        description: s.description,
        displayOrder: s.displayOrder,
        version: s.history.length,
        versionTitle: 'Last modified by ' + last.modifiedBy + ' on ' + last.modifiedOn,
        statusLabel: s.active !== false ? 'Active' : 'Inactive',
        statusBadgeClass: s.active !== false ? 'status-badge active' : 'status-badge inactive',
        rowClass: this.state.formEditId === s.id ? 'status-row selected' : 'status-row',
        onEdit: () => this.openEdit(s.id)
      };
    });

    const isNewStatus = this.state.formEditId === 'new';
    let formHistoryRows = [];
    if (this.state.formEditId && !isNewStatus) {
      const editing = this.state.statuses.find((s) => s.id === this.state.formEditId);
      if (editing) {
        formHistoryRows = editing.history.slice().reverse().map((h) => ({
          version: h.version,
          label: h.action === 'Created' ? ('Created as “' + h.newName + '”') : ('Renamed “' + h.previousName + '” → “' + h.newName + '”'),
          modifiedBy: h.modifiedBy,
          modifiedOn: h.modifiedOn
        }));
      }
    }

    return {
      navClass: this.state.navCollapsed ? 'app-nav collapsed' : 'app-nav',
      navExpanded: !this.state.navCollapsed,
      navCollapsed: this.state.navCollapsed,
      navToggleTitle: this.state.navCollapsed ? 'Expand navigator' : 'Collapse navigator',
      chevronTransform: this.state.navCollapsed ? 'rotate(180deg)' : 'none',
      toggleNav: () => this.toggleNav(),

      statusCount: this.state.statuses.length,
      rows,
      noResults: rows.length === 0,
      searchQuery: this.state.searchQuery,
      setSearchQuery: (e) => this.setSearchQuery(e),

      listOpen: !this.state.formEditId,
      formOpen: !!this.state.formEditId,
      formHeading: isNewStatus ? 'Add New Status' : ('Edit Status — ' + this.state.formOriginalName),
      openAdd: () => this.openAdd(),

      formName: this.state.formName,
      setFormName: (e) => this.setFormName(e),
      formDescription: this.state.formDescription,
      setFormDescription: (e) => this.setFormDescription(e),
      formDisplayOrder: this.state.formDisplayOrder,
      setFormDisplayOrder: (e) => this.setFormDisplayOrder(e),
      formIsActive: this.state.formActive,
      toggleFormActive: (e) => this.toggleFormActive(e),
      formOriginalName: this.state.formOriginalName,
      formRenamePreview: !isNewStatus && !!this.state.formOriginalName && this.state.formName.trim() !== '' && this.state.formName.trim() !== this.state.formOriginalName,

      isNewStatus: isNewStatus,
      hasHistory: formHistoryRows.length > 0,
      formHistoryRows: formHistoryRows,

      saveForm: () => this.saveForm(),
      cancelForm: () => this.cancelForm()
    };
  }
}


dcBoot(Component, 'app-root', 'app-template');
</script>
</body>
</html>
