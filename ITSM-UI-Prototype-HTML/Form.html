<style>
html, body { margin: 0; padding: 0; }
body { display: flex; justify-content: center; background: #E4E7EC; padding: 20px 0; box-sizing: border-box; font-family: 'Public Sans', sans-serif; }

  body { margin: 0; font-family: 'Public Sans', sans-serif; background: #F7F8FA; }
  a { color: #175CD3; text-decoration: none; }
  a:hover { text-decoration: underline; }
  .tree-grp { font-size: 10.5px; font-weight: 800; color: #8A94A6; text-transform: uppercase; letter-spacing: 0.6px; padding: 14px 14px 6px 14px; margin-top: 4px; display: flex; align-items: center; gap: 6px; border-top: 1px solid #EDEFF2; }
  .tree-grp:first-child { border-top: none; margin-top: 0; padding-top: 10px; }
  .tree-item { display: flex; align-items: center; gap: 8px; padding: 7px 14px 7px 30px; font-size: 12.5px; color: #344054; border-left: 3px solid transparent; box-sizing: border-box; }
  .tree-item:hover { background: #F5F8FE; }
  .tree-item.active { background: #E3EBFB; color: #175CD3; font-weight: 700; border-left-color: #175CD3; }
  .tree-parent { font-weight: 700; color: #1D2433; }
  .tree-child { padding-left: 30px; margin-left: 20px; border-left: 1px solid #E4E7EC; }
  .tree-child.active { border-left: 3px solid #175CD3; margin-left: 18px; }

  .eyebrow { display: flex; align-items: center; justify-content: space-between; padding-bottom: 11px; border-bottom: 2px solid #1D2433; margin-bottom: 18px; }
  .eyebrow-title { font-size: 11.5px; font-weight: 800; color: #1D2433; text-transform: uppercase; letter-spacing: 0.6px; display: flex; align-items: center; gap: 8px; }

  .field label { font-size: 10px; font-weight: 700; color: #98A2B3; text-transform: uppercase; letter-spacing: 0.5px; display: block; }
  .field .val { font-size: 13.5px; color: #1D2433; margin-top: 5px; font-weight: 500; }

  .chip { display: inline-flex; align-items: center; gap: 6px; padding: 3px 10px; border-radius: 20px; font-size: 11.5px; font-weight: 700; }
  .chip .dot { width: 6px; height: 6px; border-radius: 50%; flex: none; }

  .sla-track { height: 7px; border-radius: 20px; background: #EAECF0; overflow: hidden; margin-top: 10px; position: relative; }
  .sla-fill { height: 100%; border-radius: 20px; }

  .tl-dot { width: 24px; height: 24px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; font-size: 11px; font-weight: 700; box-shadow: 0 0 0 3px #F7F8FA; }
  .chat-bubble { max-width: 82%; padding: 9px 13px; border-radius: 12px; font-size: 12.5px; line-height: 1.5; }

  .icon-btn { height: 32px; width: 32px; border: 1px solid #D0D5DD; border-radius: 7px; background: #FFFFFF; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  .btn-ghost { height: 32px; padding: 0 14px; border: 1px solid #D0D5DD; border-radius: 7px; background: #FFFFFF; font-size: 12.5px; color: #344054; font-weight: 600; cursor: pointer; }
  .btn-primary { height: 32px; padding: 0 16px; border: none; border-radius: 7px; background: #175CD3; color: #FFFFFF; font-size: 12.5px; font-weight: 700; cursor: pointer; box-shadow: 0 1px 2px rgba(23,92,211,0.35); }
  .btn-close { height: 32px; padding: 0 16px; border: 1px solid #A6F4C5; border-radius: 7px; background: #ECFDF3; color: #067647; font-size: 12.5px; font-weight: 700; cursor: pointer; }
  .btn-dim { height: 32px; padding: 0 16px; border: 1px solid #E4E7EC; border-radius: 7px; background: #FAFBFC; color: #B0B7C3; font-size: 12.5px; font-weight: 700; cursor: pointer; }

  .app-nav { width: 260px; flex: none; background: #FFFFFF; border-right: 1px solid #D5DAE1; overflow: hidden; box-sizing: border-box; position: relative; transition: width 0.15s ease; display: flex; flex-direction: column; }
  .app-nav.collapsed { width: 60px; }
  .nav-toggle { position: absolute; top: 14px; right: -12px; width: 24px; height: 24px; border-radius: 50%; background: #FFFFFF; border: 1px solid #D5DAE1; display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 5; box-shadow: 0 1px 2px rgba(16,24,40,0.1); }
  .nav-rail-item { width: 36px; height: 36px; border-radius: 8px; display: flex; align-items: center; justify-content: center; margin: 0 auto 8px auto; cursor: pointer; color: #667085; }
  .nav-rail-item.active { background: #E3EBFB; color: #175CD3; }
  .nav-scroll { flex: 1 1 auto; min-height: 0; overflow-y: auto; }
  .nav-scroll::-webkit-scrollbar { width: 6px; }
  .nav-scroll::-webkit-scrollbar-track { background: transparent; }
  .nav-scroll::-webkit-scrollbar-thumb { background: #D0D5DD; border-radius: 6px; }
  .nav-scroll::-webkit-scrollbar-thumb:hover { background: #98A2B3; }
  .tree-subgrp { font-size: 11px; font-weight: 700; color: #475467; padding: 12px 14px 4px 44px; }
  .tree-subitem { padding-left: 44px; }

</style>

<script src="dc-mini-runtime.js"></script>
<script>

class Component extends DCLogic {
  constructor(props) {
    super(props);
    this.state = {
      status: 'in_progress',
      resolveConfirmOpen: false,
      closeConfirmOpen: false,
      navCollapsed: false
    };
  }

  toggleNav() {
    this.setState({ navCollapsed: !this.state.navCollapsed });
  }

  openResolveConfirm() {
    if (this.state.status !== 'in_progress') return;
    this.setState({ resolveConfirmOpen: true });
  }

  cancelResolve() {
    this.setState({ resolveConfirmOpen: false });
  }

  confirmResolve() {
    this.setState({ status: 'resolved', resolveConfirmOpen: false });
  }

  openCloseConfirm() {
    if (this.state.status !== 'resolved') return;
    this.setState({ closeConfirmOpen: true });
  }

  cancelClose() {
    this.setState({ closeConfirmOpen: false });
  }

  confirmClose() {
    if (this.state.status !== 'resolved') return;
    this.setState({ status: 'closed', closeConfirmOpen: false });
  }

  reopenTicket() {
    // Only a Resolved ticket can be reopened — a Closed ticket is final.
    if (this.state.status !== 'resolved') return;
    this.setState({ status: 'in_progress' });
  }

  renderVals() {
    const status = this.state.status;
    const isResolved = status === 'resolved';
    const isClosed = status === 'closed';
    const statusMap = {
      in_progress: { label: 'In Progress', bg: '#EFF4FC', color: '#175CD3', dot: '#175CD3' },
      resolved: { label: 'Resolved', bg: '#ECFDF3', color: '#067647', dot: '#12B76A' },
      closed: { label: 'Closed', bg: '#F2F4F7', color: '#667085', dot: '#98A2B3' }
    };
    const s = statusMap[status];
    return {
      isClosed: isClosed,
      isNotClosed: !isClosed,
      isResolved: isResolved,
      isOpen: status === 'in_progress',
      statusLabel: s.label,
      statusBg: s.bg,
      statusColor: s.color,
      statusDot: s.dot,
      showResolveBtn: status === 'in_progress',
      showReopenBtn: isResolved,
      showCloseBtn: isResolved,
      showResolvedStep: isResolved || isClosed,
      resolveConfirmOpen: this.state.resolveConfirmOpen,
      closeConfirmOpen: this.state.closeConfirmOpen,
      openResolveConfirm: () => this.openResolveConfirm(),
      cancelResolve: () => this.cancelResolve(),
      confirmResolve: () => this.confirmResolve(),
      openCloseConfirm: () => this.openCloseConfirm(),
      cancelClose: () => this.cancelClose(),
      confirmClose: () => this.confirmClose(),
      reopenTicket: () => this.reopenTicket(),
      navClass: this.state.navCollapsed ? 'app-nav collapsed' : 'app-nav',
      navExpanded: !this.state.navCollapsed,
      navCollapsed: this.state.navCollapsed,
      navToggleTitle: this.state.navCollapsed ? 'Expand navigator' : 'Collapse navigator',
      chevronTransform: this.state.navCollapsed ? 'rotate(180deg)' : 'none',
      toggleNav: () => this.toggleNav()
    };
  }
}


dcBoot(Component, 'app-root', 'app-template');
</script>
