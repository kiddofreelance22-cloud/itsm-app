# ─── Networks ──────────────────────────────────────────────────────────────────
networks:
  itsm_net:
    driver: bridge

# ─── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  postgres_data:
    driver: local
  caddy_data:
    driver: local
  caddy_config:
    driver: local
  ollama_data:
    driver: local

# ─── Services ──────────────────────────────────────────────────────────────────
services:

  # ── PostgreSQL ────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: itsm_postgres
    restart: unless-stopped
    env_file:
      - env.db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5433:5432" # expose to host for local tools (DBeaver, psql)
    networks:
      - itsm_net
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}" ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  # ── Backend (NestJS) ──────────────────────────────────────────────────────
  backend:
    image: itsm-app-backend:latest
    container_name: itsm_backend
    restart: unless-stopped
    env_file:
      - env.backend
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-ollama}
      OPENAI_BASE_URL: http://ollama:11434/v1
      CHAT_MODEL: qwen2.5:3b
      CHAT_TIMEOUT_MS: ${CHAT_TIMEOUT_MS:-90000}
    networks:
      - itsm_net
    depends_on:
      postgres:
        condition: service_healthy
      ollama-model:
        condition: service_completed_successfully
    healthcheck:
      test: [ "CMD-SHELL", "wget -qO- http://127.0.0.1:4000/api/docs-json > /dev/null || exit 1" ]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # ── Frontend (Next.js) ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./itsm-frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-/api}
        NEXT_PUBLIC_WS_URL: ${NEXT_PUBLIC_WS_URL:-}
    image: itsm-app-frontend:latest
    container_name: itsm_frontend
    restart: unless-stopped
    env_file:
      - path: env.frontend
        required: false
    networks:
      - itsm_net
    depends_on:
      backend:
        condition: service_healthy

  # ── Frontend React (Next.js) ─────────────────────────────────────────────
  frontend-react:
    build:
      context: ./frontend-react
      args:
        NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
    image: itsm-app-frontend-react:latest
    container_name: itsm-frontend-react
    restart: unless-stopped
    env_file:
      - .env.frontend-react
    environment:
      NEXT_PUBLIC_API_BASE_URL: ${NEXT_PUBLIC_API_BASE_URL:-/api}
    networks:
      - itsm_net
    depends_on:
      backend:
        condition: service_healthy

  # ── Local LLM (Ollama) ──────────────────────────────────────────────────
  ollama:
    image: ollama/ollama:latest
    container_name: itsm_ollama
    restart: unless-stopped
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - itsm_net
    healthcheck:
      test: ["CMD", "ollama", "list"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  ollama-model:
    image: ollama/ollama:latest
    container_name: itsm_ollama_model_pull
    restart: "no"
    command: ["pull", "qwen2.5:3b"]
    environment:
      OLLAMA_HOST: ollama:11434
    volumes:
      - ollama_data:/root/.ollama
    networks:
      - itsm_net
    depends_on:
      ollama:
        condition: service_healthy

  # ── HTTPS reverse proxy ──────────────────────────────────────────────────
  caddy:
    image: caddy:2-alpine
    container_name: itsm_caddy
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - itsm_net
    depends_on:
      frontend-react:
        condition: service_started
      backend:
        condition: service_healthy
